name: Firmware

on:
  push:
    branches: [cyd35]
    tags: ['v*']
  pull_request:
    branches: [cyd35]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every board variant that ships in a release. The T-Display is retired, so releases carry the
  # CYD firmware only; its env is still in platformio.ini and the ttgo branch still holds the
  # firmware that was released for it.
  ENVS: cyd35r_telegram

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Check the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^custom_source_version[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' platformio.ini | tr -d '\r')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match custom_source_version ${version} in platformio.ini"
            exit 1
          fi

      - name: Build
        run: |
          # One invocation on purpose: pio run wipes .pio/build for every env
          # outside its -e list, so building them in turn loses the first elf
          args=""
          for e in ${ENVS}; do args="$args -e $e"; done
          pio run $args

      - name: Collect firmware files
        run: |
          # upload-artifact skips hidden directories such as .firmware, so publish from dist/
          mkdir -p dist
          cp .firmware/* dist/
          version=$(sed -nE 's/^custom_source_version[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' platformio.ini | tr -d '\r')
          for e in ${ENVS}; do
            # Debug symbols, to decode the backtrace in a crash report from the board
            gzip -c ".pio/build/$e/firmware.elf" > "dist/Solar2MQTT_${e}_V${version}.elf.gz"
            # One .bin.ota per variant, or the boards find no matching release asset
            test -f "dist/Solar2MQTT_${e}_V${version}.bin.ota"
          done
          ls -l dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
