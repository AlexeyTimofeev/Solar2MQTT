; Parked board builds (2026-09-11): not built or maintained until one of these boards is in hand.
; PlatformIO does not read this file. To revive a board, paste its block back into platformio.ini
; (or add `extra_configs = parked-boards.ini` under [platformio]), then build and test on the hardware.
; The board classes are still in src/core/DisplayService.cpp, compiled out unless their TFT_BOARD_* flag is set.
; Hardware notes: docs-crowpanel35.md, docs-alt-boards.md, docs-cyd35.md.

; Elecrow CrowPanel 3.5" HMI (DIS05035H): classic ESP32, ILI9488 320x480 over SPI, resistive touch, case included.
; Inverter UART on the I2C header pins (IO22 TX, IO21 RX); USB serial (IO1/IO3) stays free for flashing/logs.
; Pins verified against Elecrow schematics (docs-crowpanel35.md); add -DCROWPANEL35_HW_V20 for V1.x/V2.0/V2.1 boards.
[env:crowpanel35_telegram]
board = esp32dev
monitor_filters = esp32_exception_decoder, default, printable
build_flags =
	${env.build_flags}
	-DBUILD_VARIANT=\"crowpanel35_telegram\"
	-DHAS_LAN=0
	-DHAS_TFT=1
	-DHAS_TELEGRAM=1
	-DTFT_BOARD_CROWPANEL35=1
	-DTFT_TOUCH=1
	-DTFT_ROTATION=1
	-DTFT_BUTTON_NEXT=-1
	-DTFT_BUTTON_PREV=-1
	-DPIN_LED_STATUS=-1
	-DPIN_INVERTER_RX_DEFAULT=21
	-DPIN_INVERTER_TX_DEFAULT=22
	-DPIN_INVERTER_DE_DEFAULT=-1
	-DPIN_DS18B20=32
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@^1.2.28

; Elecrow CrowPanel Advance 3.5" (ESP32-S3-WROOM-1-N16R8, 480x320 IPS, GT911 touch, acrylic case option).
; Pins verified from Elecrow's LovyanGFX driver and the Meshtastic variant (docs-alt-boards.md).
; Inverter UART on the J15 "UART1-OUT" Grove connector: RX IO18, TX IO17, 3V3, GND (Grove cable is in the box).
; Logs/flash via the CH340K USB-C port (UART0); the wireless slot must stay empty (GPIO2 is shared with LCD reset).
[env:crowpanel_adv35_telegram]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = default_16MB.csv
upload_protocol = esptool
monitor_filters = esp32_exception_decoder, default, printable
build_flags =
	${env.build_flags}
	-DBUILD_VARIANT=\"crowpanel_adv35_telegram\"
	-DHAS_LAN=0
	-DHAS_TFT=1
	-DHAS_TELEGRAM=1
	-DTFT_BOARD_CROWPANEL_ADV35=1
	-DTFT_TOUCH=1
	-DTFT_ROTATION=0
	-DTFT_BUTTON_NEXT=-1
	-DTFT_BUTTON_PREV=-1
	-DPIN_LED_STATUS=-1
	-DPIN_INVERTER_RX_DEFAULT=18
	-DPIN_INVERTER_TX_DEFAULT=17
	-DPIN_INVERTER_DE_DEFAULT=-1
	-DPIN_DS18B20=-1
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@^1.2.28

; Sunton/JC ESP32-3248S035 3.5" (AliExpress "2.4/2.8/3.5 inch LCD TFT Module ESP32", 3.5 inch option): classic ESP32 4 MB,
; ST7796 320x480 over SPI, backlight 27. Free header pins: GPIO35 (input only), 22, 21 on P3/CN1.
; Inverter UART: RX 35, TX 22; DS18B20 on 21. Pins from docs-cyd35.md.
[env:cyd35r_telegram]
board = esp32dev
monitor_filters = esp32_exception_decoder, default, printable
upload_speed = 460800
build_flags =
	${env.build_flags}
	-DBUILD_VARIANT=\"cyd35r_telegram\"
	-DHAS_LAN=0
	-DHAS_TFT=1
	-DHAS_TELEGRAM=1
	-DTFT_BOARD_CYD35=1
	-DTFT_TOUCH=1
	-DTFT_ROTATION=1
	-DTFT_BUTTON_NEXT=-1
	-DTFT_BUTTON_PREV=-1
	-DPIN_LED_STATUS=-1
	-DPIN_INVERTER_RX_DEFAULT=35
	-DPIN_INVERTER_TX_DEFAULT=22
	-DPIN_INVERTER_DE_DEFAULT=-1
	-DPIN_DS18B20=21
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@^1.2.28

