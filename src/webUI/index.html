<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Solar2MQTT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div id="container">
    <div id="header">
      <a href="/"><img id="logo" src="/logo.svg" alt="Solar2MQTT Logo"></a>
      <h1 id="deviceName">Solar2MQTT</h1>
    </div>

    <div class="panel">
      <div class="detailSplitter">Status</div>
      <p class="field-note" id="wifiLine">Wi-Fi: …</p>
      <p class="field-note" id="botLine">Telegram bot: …</p>
      <p class="field-note" id="inverterLine">Inverter: …</p>
      <p class="field-note" id="fwLine"></p>
    </div>

    <div class="button-stack">
      <button type="button" class="btn" onclick="location.href='/wifi'">Wi-Fi settings</button>
      <button type="button" class="btn" onclick="location.href='/telegram'">Telegram bot</button>
    </div>
    <p class="field-note" style="text-align:center">Alerts, battery values and charts are in the bot: 📊 Dashboard in Telegram.</p>
  </div>

  <script src="/backgroundCanvas.js"></script>
  <script>
    (async () => {
      const set = (id, text) => { document.getElementById(id).textContent = text; };
      try {
        const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
        if (s.deviceName) { set('deviceName', s.deviceName); document.title = s.deviceName; }
        const rssi = s.wifi && typeof s.wifi.rssi === 'number' ? s.wifi.rssi : null;
        set('wifiLine', 'Wi-Fi: ' + (s.wifiConnected
          ? 'connected' + (s.ip ? ', ' + s.ip : '') + (rssi !== null ? ' · ' + (rssi >= -70 ? 'good' : 'weak') + ' signal (' + rssi + ' dBm)' : '')
          : 'not connected'));
        set('inverterLine', 'Inverter: ' + (s.inverterConnected ? 'connected' + (s.protocol ? ' (' + s.protocol + ')' : '') : 'not connected'));
        set('fwLine', 'Firmware ' + (s.fw || '?'));
        let bot = 'Telegram bot: ' + (s.telegramConnected ? 'connected' : 'not connected');
        try {
          const t = await (await fetch('/api/telegram/status', { cache: 'no-store' })).json();
          if (t.ready && t.botUsername) bot = 'Telegram bot: connected as @' + t.botUsername;
          else if (t.lastError) bot += ' (' + t.lastError + ')';
        } catch (e) {}
        set('botLine', bot);
      } catch (e) {
        set('wifiLine', 'Status unavailable');
      }
    })();
  </script>
</body>
</html>
